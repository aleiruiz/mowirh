# Local development database. Mirrors the production setup: the app connects as
# mowihr_app, which cannot DELETE, DROP or TRUNCATE (see apps/api/drizzle).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mowihr_owner
      # Local-only database bound to localhost; no password is stored in the repo.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: mowihr
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
